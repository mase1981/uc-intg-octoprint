[project]
name = "uc-intg-octoprint"
dynamic = ["version"]
description = "OctoPrint 3D printer integration for Unfolded Circle Remote"
authors = [
    {name = "Meir Miyara", email = "meir.miyara@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
keywords = ["unfoldedcircle", "integration", "octoprint", "3dprinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL-2.0)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ucapi-framework>=1.9.7",
    "ucapi>=0.7.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/mase1981/uc-intg-octoprint"
Repository = "https://github.com/mase1981/uc-intg-octoprint"
Issues = "https://github.com/mase1981/uc-intg-octoprint/issues"

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["intg_octoprint"]

[tool.setuptools.dynamic]
version = {attr = "intg_octoprint.__version__"}
